 x2="23.4375" y1="91.5955" y2="1488.6444"/><rect fill="#E8F1FB" height="1397.049" style="stroke:#E8F1FB;stroke-width:1.5625;" width="295.5673" x="316.8922" y="91.5955"/><rect fill="#F1F1F1" height="97.7844" rx="10.9375" ry="10.9375" style="stroke:#181818;stroke-width:0.7813;" width="279.9423" x="326.2672" y="459.494"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="236.1923" x="348.1422" y="503.2883">Merge many spreadsheets</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="72.6212" x="348.1422" y="530.3055">by hand</text><rect fill="#F1F1F1" height="97.7844" rx="10.9375" ry="10.9375" style="stroke:#181818;stroke-width:0.7813;" width="217.1104" x="357.6832" y="588.5284"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="173.3604" x="379.5582" y="632.3227">Clean and fix errors</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="80.8235" x="379.5582" y="659.3399">manually</text><rect fill="#F1F1F1" height="97.7844" rx="10.9375" ry="10.9375" style="stroke:#181818;stroke-width:0.7813;" width="238.3255" x="347.0757" y="717.5629"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="194.5755" x="368.9507" y="761.3571">Build charts and pivot</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="159.8221" x="368.9507" y="788.3743">tables one by one</text><rect fill="#F1F1F1" height="97.7844" rx="10.9375" ry="10.9375" style="stroke:#181818;stroke-width:0.7813;" width="221.2166" x="355.6301" y="846.5973"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="177.4666" x="377.5051" y="890.3915">Email a static report</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="116.4993" x="377.5051" y="917.4088">(PDF / slides)</text><line style="stroke:#000000;stroke-width:2.3438;" x1="316.8922" x2="316.8922" y1="91.5955" y2="1488.6444"/><rect fill="#E7F6EE" height="1397.049" style="stroke:#E7F6EE;stroke-width:1.5625;" width="554.1931" x="612.4596" y="91.5955"/><rect fill="#F1F1F1" height="97.7844" rx="10.9375" ry="10.9375" style="stroke:#181818;stroke-width:0.7813;" width="249.1859" x="779.3449" y="975.6317"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="205.4359" x="801.2199" y="1019.426">Read emailed / printed</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="55.4726" x="801.2199" y="1046.4432">report</text><polygon fill="#F1F1F1" points="812.8525,1104.6661,995.0233,1104.6661,1013.7733,1137.9333,995.0233,1171.2006,812.8525,1171.2006,794.1025,1137.9333,812.8525,1104.6661" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="169.6709" x="819.1025" y="1132.8354">Numbers clear and</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="102.2568" x="819.1025" y="1159.8526">up to date?</text><text fill="#334155" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="29.0703" x="758.7822" y="1126.5854">yes</text><text fill="#334155" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="23.3971" x="1020.0233" y="1126.5854">no</text><rect fill="#F1F1F1" height="97.7844" rx="10.9375" ry="10.9375" style="stroke:#181818;stroke-width:0.7813;" width="279.2976" x="621.8346" y="1186.8256"/><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="216.6832" x="643.7096" y="1230.6198">Make decision based on</text><text fill="#000000" font-family="Segoe UI" font-size="20.3125" lengthAdjust="spacing" textLength="235.5476" x="643.7096" y="12